version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://backend:3001
    restart: unless-stopped

# Para desarrollo local sin Docker puedes usar:
#   npm run dev
